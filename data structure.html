<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DS Lab – ห้องจำลองโครงสร้างข้อมูล</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #fff;
        --tx: #1b1f2a;
        --mu: #6b7280;
        --ac: #4f46e5;
        --ac2: #10b981;
        --hl: #f59e0b;
        --bd: #e5e7eb;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1220;
          --card: #181c2e;
          --tx: #e8eaf3;
          --mu: #98a0b8;
          --ac: #818cf8;
          --ac2: #34d399;
          --hl: #fbbf24;
          --bd: #2a3047;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1220;
        --card: #181c2e;
        --tx: #e8eaf3;
        --mu: #98a0b8;
        --ac: #818cf8;
        --ac2: #34d399;
        --hl: #fbbf24;
        --bd: #2a3047;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans Thai",
          Sarabun,
          sans-serif;
      }
      .app {
        display: flex;
        align-items: flex-start;
      }
      aside {
        width: 256px;
        flex: none;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        padding: 20px 14px;
        border-right: 1px solid var(--bd);
        min-height: 100vh;
        max-height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .gh {
        font-size: 11px;
        font-weight: 700;
        color: var(--mu);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 10px 0 0;
      }
      aside h1 {
        font-size: 20px;
        margin: 0;
      }
      #prog {
        color: var(--mu);
        font-size: 13px;
      }
      #nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 10px;
        padding: 8px 14px;
        transition:
          transform 0.15s,
          background 0.2s,
          border-color 0.2s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: var(--ac);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .nv {
        text-align: left;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 14px;
        padding: 7px 12px;
      }
      .nv.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .nv i {
        font-style: normal;
        color: var(--ac2);
      }
      .nv.on i {
        color: #fff;
      }
      main {
        flex: 1;
        min-width: 0;
        padding: 24px;
        max-width: 900px;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hd h2 {
        margin: 0;
      }
      #dn.ok {
        background: var(--ac2);
        color: #fff;
        border-color: var(--ac2);
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 16px 0;
        overflow-x: auto;
      }
      .tabs button {
        white-space: nowrap;
        flex: none;
      }
      .tabs button.on {
        border-color: var(--ac);
        color: var(--ac);
        font-weight: 600;
      }
      .pn {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 20px;
        animation: fade 0.35s;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 420px;
      }
      td,
      th {
        border-bottom: 1px solid var(--bd);
        padding: 6px 10px;
        text-align: left;
      }
      td:last-child {
        color: var(--ac);
        font-weight: 600;
      }
      h3 {
        margin: 18px 0 4px;
      }
      pre {
        background: var(--bg);
        padding: 14px;
        border-radius: 12px;
        overflow-x: auto;
        font-size: 14px;
        line-height: 1.5;
      }
      .ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .ctl #val {
        width: 104px;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      .ghost {
        background: transparent;
      }
      .sp {
        margin: 10px 0;
        color: var(--mu);
        font-size: 14px;
      }
      .stage {
        min-height: 340px;
        margin: 12px 0;
        border-radius: 12px;
        background: var(--bg);
        padding: 16px;
        display: flex;
        overflow: auto;
      }
      .stage > * {
        margin: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stack .row {
        flex-direction: column-reverse;
        align-items: stretch;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .stack .cell {
        flex-direction: row;
        gap: 10px;
      }
      .cell small {
        color: var(--mu);
        font-size: 11px;
        font-weight: 600;
        min-height: 14px;
        white-space: nowrap;
      }
      .node {
        min-width: 52px;
        height: 46px;
        display: grid;
        place-items: center;
        padding: 0 10px;
        border: 2px solid var(--ac);
        border-radius: 10px;
        background: var(--card);
        font-weight: 700;
        transition:
          background 0.25s,
          transform 0.25s;
      }
      .node.hi {
        background: var(--hl);
        color: #111;
        transform: scale(1.12);
      }
      .node.pop {
        animation: pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      .node.out {
        animation: out 0.35s forwards;
      }
      @keyframes pop {
        from {
          transform: scale(0.2);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes out {
        to {
          transform: translateY(-18px) scale(0.2);
          opacity: 0;
        }
      }
      .arr {
        color: var(--mu);
        font-weight: 700;
        white-space: nowrap;
      }
      .node.ok {
        background: var(--ac2);
        color: #fff;
        border-color: var(--ac2);
      }
      .node.emp {
        opacity: 0.35;
        border-style: dashed;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 220px;
      }
      .bar {
        width: 30px;
        border-radius: 6px 6px 0 0;
        background: var(--ac);
        color: #fff;
        text-align: center;
        font-size: 12px;
        padding-top: 2px;
        transition:
          height 0.3s,
          background 0.2s;
      }
      .bar.hi {
        background: var(--hl);
        color: #111;
      }
      .bar.ok {
        background: var(--ac2);
      }
      .hb {
        width: 100%;
        max-width: 560px;
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .hr span {
        width: 84px;
        font-size: 13px;
      }
      .hr b {
        font-size: 13px;
        min-width: 60px;
      }
      .hf {
        height: 18px;
        border-radius: 6px;
        background: var(--ac);
        animation: grow 0.6s;
      }
      @keyframes grow {
        from {
          width: 0;
        }
      }
      .dl {
        fill: var(--ac);
        font-size: 12px;
        font-weight: 700;
        text-anchor: middle;
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .empty {
        color: var(--mu);
      }
      .tn circle {
        fill: var(--card);
        stroke: var(--ac);
        stroke-width: 2;
        transition: fill 0.25s;
      }
      .tn.hi circle {
        fill: var(--hl);
      }
      .tn.ok circle {
        fill: var(--ac2);
      }
      .tn.pop {
        animation: pop 0.45s;
        transform-box: fill-box;
        transform-origin: center;
      }
      .tn text {
        fill: var(--tx);
        text-anchor: middle;
        font-weight: 700;
        font-size: 14px;
      }
      .tn.hi text {
        fill: #111;
      }
      svg line {
        stroke: var(--mu);
        stroke-width: 2;
      }
      .cap {
        color: var(--tx);
        font-weight: 600;
        font-size: 16px;
        min-height: 26px;
        margin: 8px 0 0;
      }
      .what {
        background: var(--bg);
        border-left: 4px solid var(--ac);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 6px;
      }
      .what p {
        margin: 6px 0 0;
      }
      .sp {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .sp label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .log {
        font-size: 13px;
        color: var(--mu);
        max-height: 150px;
        overflow: auto;
        border-top: 1px solid var(--bd);
        margin-top: 8px;
        padding-top: 6px;
      }
      .log div {
        padding: 2px 0;
      }
      .log:not(:empty)::before {
        content: "ขั้นตอนก่อนหน้า";
        display: block;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .q {
        margin-bottom: 16px;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }
      .opts .ok {
        background: var(--ac2);
        color: #fff;
        border-color: var(--ac2);
      }
      .opts .bad {
        background: #ef4444;
        color: #fff;
        border-color: #ef4444;
      }
      @media (max-width: 760px) {
        .gh {
          display: none;
        }
        .app {
          flex-direction: column;
        }
        aside {
          max-height: none;
          position: static;
          width: 100%;
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--bd);
        }
        #nav {
          flex-direction: row;
          overflow-x: auto;
        }
        .nv {
          white-space: nowrap;
          gap: 8px;
        }
        main {
          padding: 16px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <h1>🧪 DS Lab</h1>
        <div style="font-size: 12px; color: var(--mu)">
          ห้องทดลองจำลองโครงสร้างข้อมูล
        </div>
        <div id="prog"></div>
        <nav id="nav"></nav>
        <button id="th" class="ghost">🌓 ธีม</button>
      </aside>
      <main id="main"></main>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const ld = (k, d) => {
        try {
          const v = JSON.parse(localStorage.getItem(k));
          return v == null ? d : v;
        } catch (e) {
          return d;
        }
      };
      const sv = (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      };
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      let done = ld("dsl", []),
        cur = "stack",
        tab = "viz",
        busy = false,
        sp = 6,
        qa = {};
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      let paused = false,
        stepMode = false,
        stepRes = null;
      const gate = async (ms) => {
        if (stepMode) {
          await new Promise((r) => {
            stepRes = r;
          });
          return;
        }
        await wait(ms);
        while (paused) await wait(120);
      };
      const delay = () => gate(1500 - sp * 130);
      const say = (t) => {
        const c = $("#cap"),
          L = $("#log");
        if (c) {
          if (c.dataset.s && L) {
            const d = document.createElement("div");
            d.textContent = c.textContent;
            L.prepend(d);
            while (L.children.length > 8) L.lastChild.remove();
          }
          c.textContent = t;
          c.dataset.s = 1;
        }
      };
      const th = ld("dst", null);
      if (th) document.documentElement.dataset.theme = th;
      $("#th").onclick = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme
          ? d.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme:dark)").matches;
        d.dataset.theme = dark ? "light" : "dark";
        sv("dst", d.dataset.theme);
      };

      const T = {
        stack: {
          n: "สแตก (Stack)",
          what: "สแตกคือโครงสร้างข้อมูลที่เก็บข้อมูลซ้อนกันเป็นชั้น ๆ เหมือนกองจานในร้านอาหาร ใส่จานใหม่ได้เฉพาะบนสุด และหยิบออกได้เฉพาะจานบนสุดเท่านั้น จึงได้ตัวที่ใส่เข้าไปล่าสุดออกมาก่อนเสมอ",
          ic: "📚",
          learn:
            "สแตกทำงานแบบ LIFO — Last In, First Out (เข้าทีหลังออกก่อน) เหมือนกองจาน คือเพิ่มหรือเอาออกได้เฉพาะที่บนสุดเท่านั้น",
          cx: [
            ["Push", "O(1)"],
            ["Pop", "O(1)"],
            ["Peek", "O(1)"],
            ["ค้นหา", "O(n)"],
          ],
          uses: "Undo/Redo, ปุ่มย้อนกลับของเบราว์เซอร์, call stack ของฟังก์ชัน, ตรวจวงเล็บให้ตรงกัน",
          code: `class Stack {
  constructor() { this.items = []; }
  push(x) { this.items.push(x); }
  pop()   { return this.items.pop(); }
  peek()  { return this.items[this.items.length - 1]; }
  isEmpty() { return this.items.length === 0; }
}`,
          quiz: [
            [
              "สแตกทำงานตามลำดับแบบใด?",
              ["FIFO", "LIFO", "เรียงลำดับ", "สุ่ม"],
              1,
            ],
            [
              "ความซับซ้อนเวลาของ push คือ?",
              ["O(1)", "O(n)", "O(log n)", "O(n²)"],
              0,
            ],
          ],
        },
        queue: {
          n: "คิว (Queue)",
          what: "คิวคือโครงสร้างข้อมูลที่เก็บข้อมูลเรียงเป็นแถวเหมือนคนต่อคิวซื้อของ คนที่มาถึงก่อนจะได้รับบริการก่อน ส่วนคนมาใหม่ต้องไปต่อท้ายแถว",
          ic: "🚶",
          learn:
            "คิวทำงานแบบ FIFO — First In, First Out (เข้าก่อนออกก่อน) เหมือนต่อแถวซื้อของ คือเข้าต่อที่ท้ายแถว (rear) และออกจากหน้าแถว (front)",
          cx: [
            ["Enqueue", "O(1)"],
            ["Dequeue", "O(1)"],
            ["Peek", "O(1)"],
            ["ค้นหา", "O(n)"],
          ],
          uses: "คิวงานเครื่องพิมพ์, การจัดตารางงานของ OS, BFS ในกราฟ, บัฟเฟอร์ข้อความ",
          code: `class Queue {
  constructor() { this.items = []; }
  enqueue(x) { this.items.push(x); }
  dequeue()  { return this.items.shift(); }
  front()    { return this.items[0]; }
}`,
          quiz: [
            [
              "การ dequeue ทำที่ปลายด้านไหน?",
              ["ท้ายคิว (Rear)", "หน้าคิว (Front)", "ตรงกลาง", "ด้านไหนก็ได้"],
              1,
            ],
            [
              "คิวงานของเครื่องพิมพ์เป็นตัวอย่างของ…",
              ["LIFO", "FIFO", "Heap", "Tree"],
              1,
            ],
          ],
        },
        list: {
          n: "ลิงก์ลิสต์ (Linked List)",
          what: "ลิงก์ลิสต์คือโครงสร้างข้อมูลที่ไม่ได้เก็บข้อมูลติดกันในหน่วยความจำ แต่ให้แต่ละชิ้นข้อมูล (โหนด) จำว่าชิ้นถัดไปอยู่ที่ไหน เหมือนเกมล่าสมบัติที่แต่ละจุดมีเบาะแสบอกจุดต่อไป จึงเพิ่มหรือลบข้อมูลได้ง่ายโดยไม่ต้องขยับข้อมูลอื่น แต่จะกระโดดไปยังตำแหน่งที่ต้องการทันทีไม่ได้",
          ic: "🔗",
          learn:
            "ลิงก์ลิสต์คือโหนดที่ต่อกันเป็นสายโซ่ แต่ละโหนดเก็บค่าและพอยน์เตอร์ชี้ไปโหนดถัดไป โหนดแรกคือ HEAD และโหนดสุดท้ายชี้ไป null",
          cx: [
            ["แทรกที่ head", "O(1)"],
            ["แทรกที่ tail*", "O(n)"],
            ["ค้นหา", "O(n)"],
            ["ลบ", "O(n)"],
          ],
          uses: "เพลย์ลิสต์เพลง, ประวัติ undo, ตัวจัดสรรหน่วยความจำ, ใช้สร้างสแตกและคิว (*เป็น O(1) ถ้าเก็บพอยน์เตอร์ tail ไว้)",
          code: `class Node {
  constructor(val) { this.val = val; this.next = null; }
}
class LinkedList {
  constructor() { this.head = null; }
  addHead(v) { const n = new Node(v); n.next = this.head; this.head = n; }
  addTail(v) {
    const n = new Node(v);
    if (!this.head) { this.head = n; return; }
    let c = this.head;
    while (c.next) c = c.next;
    c.next = n;
  }
}`,
          quiz: [
            [
              "การอ่านโหนดที่ k ของ singly linked list ใช้เวลา…",
              ["O(1)", "O(n)", "O(log n)", "O(n²)"],
              1,
            ],
            [
              "การแทรกที่ head ใช้เวลา…",
              ["O(1)", "O(n)", "O(log n)", "O(n log n)"],
              0,
            ],
          ],
        },
        bst: {
          n: "ต้นไม้ค้นหาแบบไบนารี (BST)",
          what: "BST คือต้นไม้ที่จัดข้อมูลให้ค้นหาได้เร็ว เหมือนเกมทายเลขที่ถามว่า มากกว่าหรือน้อยกว่า แล้วตัดตัวเลือกทิ้งครึ่งหนึ่งทุกครั้ง โดยค่าน้อยจะอยู่ทางซ้ายและค่ามากอยู่ทางขวาของทุกโหนด",
          ic: "🌳",
          learn:
            "ใน BST แต่ละโหนดมีลูกได้ไม่เกินสองตัว ค่าที่น้อยกว่าไปทางซ้าย ค่าที่มากกว่าไปทางขวา ทำให้แต่ละขั้นตัดพื้นที่ค้นหาลงครึ่งหนึ่ง",
          cx: [
            ["ค้นหา (เฉลี่ย)", "O(log n)"],
            ["แทรก (เฉลี่ย)", "O(log n)"],
            ["กรณีแย่ที่สุด", "O(n)"],

      R.sp = (c = -1, vis = [], d = [], hot = []) =>

      async function trav(s, bfs) {

          seen = new Set([s]),

          const add = nb(u).filter((x) =>
            bfs ? !seen.has(x) : !vis.includes(x),

          (bfs ? add : add.reverse()).forEach((x) => {

            `${bfs ? "Dequeue" : "Pop"} ${u}: เยี่ยมชมโหนดนี้ แล้ว ${bfs ? "enqueue" : "push"} โหนดข้างเคียงที่ยังไม่เคยเยี่ยมชม`,

          await delay();

        R.graph(-1, vis, [], `ลำดับการเยี่ยมชม: ${vis.join(" → ")}`);

          vis.push(u);

          GE.forEach(([a, b, w]) => {

                await delay();
              }
              say(`sum[0..${r}] = ${acc} ใช้แค่ ${L.length} โหนด: O(log n)`);
            },
          },
          {
            l: "อัปเดต a[i] += 5",
            n: 1,
            f: async (v) => {
              const i = v % 8,
                path = [];
              for (let k = 8 + i; k >= 1; k >>= 1) path.push(k);
              S.seg[i] += 5;
              for (let k = 0; k < path.length; k++) {
                R.segtree(path.slice(0, k + 1));
                say(
                  k
                    ? `คำนวณโหนดด้านบน (ancestor) ${path[k]} ใหม่`
                    : `ใบ a[${i}] กลายเป็น ${S.seg[i]}`,
                );
                await delay();
              }
              say(`อัปเดตแค่ ${path.length} โหนด: O(log n)`);
            },
          },
        ],
        graph: [
          { l: "BFS จากโหนด", f: async (v) => trav(v % 7, true) },
          { l: "DFS จากโหนด", f: async (v) => trav(v % 7, false) },
        ],
        sp: [
          { l: "Dijkstra จากโหนด", f: async (v) => dijk(v % 7) },
          { l: "Prim MST จากโหนด", f: async (v) => prim(v % 7) },
        ],
        dsu: [
          {
            l: "Union (a b)",
            f: async (v) => {
              const [a, b] = two(v),
                ra = dfind(a).at(-1),
                rb = dfind(b).at(-1);
              R.dsu([a, b]);
              say(`union(${a}, ${b}): หา root → ${ra} และ ${rb}`);
              await delay();
              if (ra === rb) return say("อยู่ในเซตเดียวกันแล้ว ไม่ต้องทำอะไร");
              const sz = (r) =>
                  S.dsu.filter((_, i) => dfind(i).at(-1) === r).length,
                [big, sm] = sz(ra) >= sz(rb) ? [ra, rb] : [rb, ra];
              S.dsu[sm] = big;
              R.dsu([big]);
              say(`Union by size: root ${sm} ชี้ไปที่ root ${big}`);
            },
          },
          {
            l: "Find (x)",
            n: 1,
            f: async (v) => {
              const x = two(v)[0],
                p = dfind(x),
                r = p.at(-1);
              R.dsu(p);
              say(`find(${x}): เส้นทาง ${p.join(" → ")} (root ${r})`);
              await delay();
              p.forEach((k) => {
                S.dsu[k] = r;
              });
              R.dsu(p);
              say(`Path compression: ทุกโหนดบนเส้นทางชี้ตรงไปที่ ${r}`);
            },
          },
        ],
        sort: [
          sortOp("Bubble", bub, "Bubble sort, O(n²)"),
          sortOp("Selection", sel, "Selection sort, O(n²)"),
          sortOp("Insertion", ins, "Insertion sort, O(n²)"),
          sortOp("Quick", qs, "Quick sort, O(n log n) avg"),
          sortOp("Merge", ms, "Merge sort, O(n log n)"),
          {
            l: "สุ่มใหม่",
            f: async () => {
              S.sort = Array.from({ length: 10 }, () => RI(90));
              R.sort();
              say("สุ่มข้อมูลใหม่แล้ว: เลือกอัลกอริทึมการเรียง");
            },
          },
        ],
        search: [
          {
            l: "ค้นแบบเชิงเส้น",
            n: 1,
            f: async (v) => {
              const a = S.search;
              for (let i = 0; i < a.length; i++) {
                R.search(i);
                say(
                  `ตรวจ a[${i}] = ${a[i]}${a[i] === v ? " — เจอแล้ว!" : " ≠ " + v}`,
                );
                await delay();
                if (a[i] === v) {
                  R.search(i, 0, 99, i);
                  return;
                }
              }
              say(`ไม่พบ ${v} หลังตรวจ ${a.length} ครั้ง: O(n)`);
            },
          },
          {
            l: "ค้นแบบ Binary",
            n: 1,
            f: async (v) => {
              const a = S.search;
              let lo = 0,
                hi = a.length - 1,
                steps = 0;
              while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                steps++;
                R.search(mid, lo, hi);
                say(
                  `lo=${lo}, hi=${hi}, mid=${mid}: a[mid]=${a[mid]} ${a[mid] === v ? "=" : a[mid] < v ? "<" : ">"} ${v}${a[mid] === v ? "" : a[mid] < v ? " → ค้นครึ่งขวา" : " → ค้นครึ่งซ้าย"}`,
                );
                await delay();
                if (a[mid] === v) {
                  R.search(mid, lo, hi, mid);
                  say(`พบที่ index ${mid} หลัง ${steps} ขั้นตอน: O(log n)`);
                  return;
                }
                if (a[mid] < v) lo = mid + 1;
                else hi = mid - 1;
              }
              R.search(-1, 1, 0);
              say(`ไม่พบ ${v} หลัง ${steps} ขั้นตอน`);
            },
          },
        ],
        adv: [
          {
            l: "LRU put",
            f: async (v) => {
              const l = S.adv.l,
                i = l.indexOf(v);
              if (i >= 0) {
                R.adv(i);
                say(`${v} อยู่ในแคชแล้ว → ย้ายไปหน้าสุด`);
                await delay();
                l.splice(i, 1);
              } else if (l.length >= 4) {
                R.adv(3);
                say(
                  `แคชเต็ม → ลบ (evict) ตัวที่ไม่ได้ใช้มานานที่สุด (${l[3]})`,
                );
                await delay();
                l.pop();
              }
              l.unshift(v);
              R.adv(-1, 0);
              say(`${v} เป็นตัวที่ใช้ล่าสุดแล้ว`);
            },
          },
          {
            l: "LRU get",
            n: 1,
            f: async (v) => {
              const l = S.adv.l,
                i = l.indexOf(v);
              if (i < 0) {
                R.adv();
                say(`Miss: ไม่มี ${v} ในแคช`);
                return;
              }
              R.adv(i);
              say(`Hit! เจอ ${v} → ย้ายไปหน้าสุด`);
              await delay();
              l.splice(i, 1);
              l.unshift(v);
              R.adv(-1, 0);
              say(`${v} เป็นตัวที่ใช้ล่าสุด: O(1) ด้วย hash map + linked list`);
            },
          },
          {
            l: "Bloom add",
            f: async (v) => {
              const p = bh(v);
              R.adv(-1, -1, p);
              say(`แฮช ${v} → บิต ${p.join(", ")}; ตั้งเป็น 1`);
              await delay();
              p.forEach((k) => {
                S.adv.b[k] = 1;
              });
              R.adv();
              say(`เพิ่ม ${v} ลง Bloom filter แล้ว`);
            },
          },
          {
            l: "Bloom check",
            n: 1,
            f: async (v) => {
              const p = bh(v),
                b = S.adv.b;
              R.adv(-1, -1, p);
              say(
                `บิต ${p.join(", ")} → ${p.every((k) => b[k]) ? "เป็น 1 ทั้งหมด: อาจมีอยู่ (อาจเป็น false positive)" : "เจอ 0: ไม่มีแน่นอน"}`,
              );
            },
          },
        ],
      });

      const PK = {
        list: () => S.list,
        hash: () => S.hash.flat(),
        search: () => S.search,
        adv: () => S.adv.l,
        segtree: () => [0, 1, 2, 3, 4, 5, 6, 7],
        bigo: () => [8, 16, 64, 256, 1024],
        trie: () => W,
        dsu: () => [0, 1, 2, 3, 4, 5, 6, 7],
        array: () => S.array.a.map((_, i) => i),
        btree: () => {
          const o = [];
          (function g(n) {
            o.push(...n.k);
            if (!n.leaf) n.c.forEach(g);
          })(S.btree);
          return o;
        },
        bst: () => {
          const o = [];
          (function g(n) {
            if (n) {
              g(n.l);
              o.push(n.v);
              g(n.r);
            }
          })(S.bst);
          return o;
        },
      };
      R.dsu = (hl = []) => {
        const p = S.dsu,
          H = [].concat(hl),
          ch = p.map(() => []),
          ns = {};
        p.forEach((q, i) => {
          if (q !== i) ch[q].push(i);
        });
        let k = 0,
          md = 0;
        const g = (u, d) => {
          md = Math.max(md, d);
          ch[u].forEach((c) => g(c, d + 1));
          ns[u] = {
            y: d * 60 + 26,
            x: ch[u].length
              ? ch[u].reduce((s, c) => s + ns[c].x, 0) / ch[u].length
              : k++ * 46 + 26,
          };
        };
        p.forEach((q, i) => {
          if (q === i) g(i, 0);
        });
        st(
          `<div><svg width="${k * 46 + 10}" height="${md * 60 + 60}">${p.map((q, i) => (q !== i ? `<line x1="${ns[i].x}" y1="${ns[i].y}" x2="${ns[q].x}" y2="${ns[q].y}"/>` : "")).join("")}${p.map((q, i) => `<g class="tn ${H.includes(i) ? "hi" : ""}"><circle cx="${ns[i].x}" cy="${ns[i].y}" r="18" ${q === i ? 'style="stroke-width:5"' : ""}/><text x="${ns[i].x}" y="${ns[i].y}" dy=".35em">${i}</text></g>`).join("")}</svg><p class="arr">parent[] = [${p.join(", ")}] (วงหนา = root)</p></div>`,
        );
      };
      async function run(i) {
        if (busy) return;
        const op = OPS[cur][i],
          raw = $("#val").value;
        let pk = null;
        if (op.n && raw === "") {
          const c = PK[cur] && PK[cur]();
          if (!c || !c.length) {
            say("ยังไม่มีข้อมูลให้เลือก ลองเพิ่มข้อมูลก่อน");
            return;
          }
          pk = c[Math.floor(Math.random() * c.length)];
        }
        const v =
          pk !== null
            ? pk
            : raw === ""
              ? 10 + Math.floor(Math.random() * 90)
              : raw.trim() !== "" && !isNaN(+raw)
                ? +raw
                : raw;
        if (typeof v === "string" && !["trie", "dsu"].includes(cur)) {
          say("หัวข้อนี้ใช้ได้เฉพาะตัวเลข");
          return;
        }
        busy = true;
        lock(true);
        await op.f(v);
        busy = false;
        lock(false);
        if (!done.includes(cur)) {
          done.push(cur);
          sv("dsl", done);
          const ic = document.querySelector(".nv.on i"),
            pr = $("#prog"),
            dn = $("#dn");
          if (ic) ic.textContent = "✓";
          if (pr)
            pr.textContent = `ลองจำลองแล้ว ${done.length}/${Object.keys(T).length} หัวข้อ`;
          if (dn) {
            dn.className = "ok";
            dn.textContent = "✓ ลองแล้ว";
          }
        }
      }
      function lock(b) {
        document
          .querySelectorAll(".ctl button")
          .forEach((x) => (x.disabled = b));
      }

      function quiz() {
        const t = T[cur];
        return (
          t.quiz
            .map(
              (q, qi) =>
                `<div class="q"><b>${qi + 1}. ${q[0]}</b><div class="opts">${q[1]
                  .map((o, oi) => {
                    const s = qa[qi];
                    return `<button data-q="${qi}" data-o="${oi}" class="${s === undefined ? "" : oi === q[2] ? "ok" : oi === s ? "bad" : ""}" ${s !== undefined ? "disabled" : ""}>${o}</button>`;
                  })
                  .join("")}</div></div>`,
            )
            .join("") +
          `<p class="cap">คะแนน: ${Object.keys(qa).filter((k) => qa[k] === t.quiz[k][2]).length}/${t.quiz.length}</p>`
        );
      }
      function panel() {
        const t = T[cur],
          p = $("#pn");
        if (tab === "learn")
          p.innerHTML = `<div class="what"><b>📌 คืออะไร?</b><p>${t.what}</p></div><h3>รายละเอียดสำคัญ</h3><p>${t.learn}</p><h3>ความซับซ้อนเวลา</h3><table><tr><th>การทำงาน</th><th>เวลา</th></tr>${t.cx.map((r) => `<tr><td style="color:inherit;font-weight:400">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><h3>นำไปใช้ที่ไหนบ้าง</h3><p>${t.uses}</p>`;
        else if (tab === "viz") {
          p.innerHTML = `<div class="ctl"><input id="val" placeholder="ค่า" maxlength="9" size="9">${OPS[cur].map((o, i) => `<button data-i="${i}">${o.l}</button>`).join("")}<button data-r class="ghost">รีเซ็ต</button></div><div class="sp">ความเร็ว <input id="sp" type="range" min="1" max="10" value="${sp}"> <button id="ps" class="ghost">⏸ หยุดชั่วคราว</button> <label><input type="checkbox" id="sm" ${stepMode ? "checked" : ""}> โหมดทีละขั้น</label> <button id="nx" class="ghost" ${stepMode ? "" : "disabled"}>⏭ ขั้นต่อไป</button></div><div id="stage" class="stage ${cur}"></div><p id="cap" class="cap">เว้นช่องไว้ก็ได้ ระบบจะสุ่มค่าให้ (ปุ่มค้นหา/ลบจะสุ่มจากค่าที่มีอยู่) แล้วกดปุ่มการทำงานด้านบน</p><div id="log" class="log"></div>`;
          p.querySelectorAll("[data-i]").forEach(
            (b) => (b.onclick = () => run(+b.dataset.i)),
          );
          p.querySelector("[data-r]").onclick = () => {
            if (busy) return;
            init();
            draw();
            say("รีเซ็ตเป็นข้อมูลเริ่มต้นแล้ว");
          };
          $("#sp").oninput = (e) => {
            sp = +e.target.value;
          };
          paused = false;
          $("#ps").onclick = (e) => {
            paused = !paused;
            e.target.textContent = paused ? "▶ เล่นต่อ" : "⏸ หยุดชั่วคราว";
          };
          $("#sm").onchange = (e) => {
            stepMode = e.target.checked;
            $("#nx").disabled = !stepMode;
            if (!stepMode && stepRes) {
              stepRes();
              stepRes = null;
            }
          };
          $("#nx").onclick = () => {
            if (stepRes) {
              stepRes();
              stepRes = null;
            }
          };
          $("#val").onkeydown = (e) => {
            if (e.key === "Enter") run(0);
          };
          draw();
        } else if (tab === "code") p.innerHTML = `<pre>${esc(t.code)}</pre>`;
        else {
          p.innerHTML = quiz();
          p.querySelectorAll("[data-q]").forEach(
            (b) =>
              (b.onclick = () => {
                qa[b.dataset.q] = +b.dataset.o;
                panel();
              }),
          );
        }
      }
      function render() {
        const t = T[cur];
        $("#nav").innerHTML = Object.entries(GROUPS)
          .map(
            ([g, ks]) =>
              `<div class="gh">${g}</div>` +
              ks
                .map(
                  (k) =>
                    `<button class="nv ${k === cur ? "on" : ""}" data-k="${k}">${T[k].ic} ${T[k].n}<i>${done.includes(k) ? "✓" : ""}</i></button>`,
                )
                .join(""),
          )
          .join("");
        $("#prog").textContent =
          `ลองจำลองแล้ว ${done.length}/${Object.keys(T).length} หัวข้อ`;
        document.querySelectorAll(".nv").forEach(
          (b) =>
            (b.onclick = () => {
              if (busy) return;
              cur = b.dataset.k;
              tab = "viz";
              qa = {};
              render();
            }),
        );
        const tn = {
          viz: "🎬 จำลองการทำงาน",
          learn: "📖 ทฤษฎีย่อ",
          code: "💻 โค้ด",
          quiz: "❓ ทดสอบความเข้าใจ",
        };
        $("#main").innerHTML =
          `<div class="hd"><h2>${t.ic} ${t.n}</h2><button id="dn" class="${done.includes(cur) ? "ok" : ""}">${done.includes(cur) ? "✓ ลองแล้ว" : "ทำเครื่องหมายว่าลองแล้ว"}</button></div><div class="tabs">${Object.keys(
            tn,
          )
            .filter((k) => k !== "viz" || OPS[cur])
            .map(
              (k) =>
                `<button data-t="${k}" class="${k === tab ? "on" : ""}">${tn[k]}</button>`,
            )
            .join("")}</div><section class="pn" id="pn"></section>`;
        $("#dn").onclick = () => {
          done = done.includes(cur)
            ? done.filter((x) => x !== cur)
            : [...done, cur];
          sv("dsl", done);
          render();
        };
        document.querySelectorAll("[data-t]").forEach(
          (b) =>
            (b.onclick = () => {
              if (busy) return;
              tab = b.dataset.t;
              render();
            }),
        );
        panel();
      }
      render();
    </script>
  </body>
</html>
